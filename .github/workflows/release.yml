name: release

# Builds a version of Grammateus from its source code (aubrika/grammateus) and publishes it
# here: the four installers as a release, and the files in updates/ that installed copies
# read to find it.
#
# To publish a version: write what is new in notes/<version>.md, then on the Actions tab
# choose "release", then "Run workflow", and give the version and the commit or tag of the
# source to build. The version must match the one in that commit's package.json.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as in package.json (for example 0.8.0)
        required: true
      ref:
        description: Commit, tag or branch of aubrika/grammateus to build
        required: true
        default: master

jobs:
  # One installer per operating system, each built on that system.
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            name: windows
          - os: macos-latest
            script: dist:mac
            name: mac
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aubrika/grammateus
          ref: ${{ inputs.ref }}
      - name: Check the version
        shell: bash
        run: |
          found=$(node -p "require('./package.json').version")
          if [ "$found" != "${{ inputs.version }}" ]; then
            echo "::error::package.json at ${{ inputs.ref }} says $found, not ${{ inputs.version }}"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: grammateus-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Check that everything is there
        run: |
          ls -l files
          test -f "notes/$VERSION.md" || { echo "::error::notes/$VERSION.md is missing"; exit 1; }
          for f in windows.exe mac.dmg linux.AppImage linux.deb windows.exe.blockmap; do
            test -f "files/Grammateus-$VERSION-$f" || { echo "::error::Grammateus-$VERSION-$f was not built"; exit 1; }
          done
          test -f files/latest.yml && test -f files/latest-linux.yml
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION is already published"; exit 1; fi
      # first the downloads, so the addresses in updates/ work as soon as they are there
      - name: Publish the installers
        run: |
          gh release create "v$VERSION" --target main --title "Grammateus $VERSION" --notes-file "notes/$VERSION.md" \
            "files/Grammateus-$VERSION-windows.exe" "files/Grammateus-$VERSION-mac.dmg" \
            "files/Grammateus-$VERSION-linux.AppImage" "files/Grammateus-$VERSION-linux.deb"
      # installed copies read these: each file name becomes the full address of that download,
      # and the Windows block map is kept beside the earlier ones
      - name: Point updates/ to this version
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION"
          for f in latest.yml latest-linux.yml; do
            sed -E "s#^(\s*-?\s*(url|path): )(Grammateus-[^ ]+)\$#\1$base/\3#" "files/$f" > "updates/$f"
          done
          cp "files/Grammateus-$VERSION-windows.exe.blockmap" updates/
          cat updates/latest.yml updates/latest-linux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates
          git commit -m "Updates point to $VERSION"
          git push origin HEAD:main
